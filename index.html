<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultimate UI</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600&display=swap" rel="stylesheet">

<style>
:root {
  --bg:#0a0a0a;
  --text:#fff;
  --primary:#00f7ff;
}

.light {
  --bg:#fff;
  --text:#111;
  --primary:#007bff;
}

.hybrid {
  --bg:#0f172a;
  --text:#e5e7eb;
  --primary:#22d3ee;
}

*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'Inter',sans-serif;
  background:var(--bg);
  color:var(--text);
  overflow-x:hidden;
}

/* CURSOR GLOW */
.cursor-glow{
  position:fixed;
  width:300px;
  height:300px;
  background:radial-gradient(circle, var(--primary), transparent 70%);
  pointer-events:none;
  transform:translate(-50%,-50%);
  z-index:-1;
}

/* NAV */
nav{
  position:fixed;
  width:100%;
  padding:15px 40px;
  display:flex;
  justify-content:space-between;
  backdrop-filter:blur(12px);
}

/* HERO */
.hero{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
}

.hero h1{
  font-size:4rem;
  background:linear-gradient(90deg,var(--primary),#ff00ff);
  -webkit-background-clip:text;
  color:transparent;
}

/* MAGNETIC BUTTON */
.btn{
  margin-top:20px;
  padding:14px 28px;
  border-radius:30px;
  background:var(--primary);
  border:none;
  cursor:pointer;
  position:relative;
  transition:0.2s;
}

/* PARALLAX */
.layer{
  transform:translateZ(0);
  transition:transform 0.2s;
}

/* SECTIONS */
section{padding:120px 10%;}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:30px;
}

/* GLASS */
.glass{
  background:rgba(255,255,255,0.05);
  padding:30px;
  border-radius:20px;
  backdrop-filter:blur(20px);
  transition:0.4s;
}
.glass:hover{
  transform:translateY(-12px) scale(1.03);
}

/* REVEAL */
.reveal{
  opacity:0;
  transform:translateY(60px);
  transition:1s;
}
.reveal.show{
  opacity:1;
  transform:translateY(0);
}

.theme-switch{
  position:fixed;
  bottom:20px;
  right:20px;
}

</style>
</head>

<body>

<div class="cursor-glow" id="glow"></div>

<nav>
  <h3>⚡ Ultimate</h3>
</nav>

<section class="hero">
  <div class="layer">
    <h1>Beyond Interface</h1>
    <button class="btn" id="magnet">Enter</button>
  </div>
</section>

<section>
  <h2>Features</h2>
  <div class="grid">
    <div class="glass reveal">⚡ Speed</div>
    <div class="glass reveal">🎨 Design</div>
    <div class="glass reveal">🌌 Experience</div>
  </div>
</section>

<div class="theme-switch">
  <button onclick="setTheme('')">Cyberpunk</button>
  <button onclick="setTheme('light')">Minimal</button>
  <button onclick="setTheme('hybrid')">Hybrid</button>
</div>

<script>
/* THEME */
function setTheme(t){document.body.className=t;}

/* CURSOR GLOW */
const glow=document.getElementById("glow");
document.addEventListener("mousemove",e=>{
  glow.style.left=e.clientX+"px";
  glow.style.top=e.clientY+"px";
});

/* MAGNETIC BUTTON */
const btn=document.getElementById("magnet");
btn.addEventListener("mousemove",e=>{
  const rect=btn.getBoundingClientRect();
  const x=e.clientX-rect.left-rect.width/2;
  const y=e.clientY-rect.top-rect.height/2;
  btn.style.transform=`translate(${x*0.2}px,${y*0.2}px)`;
});
btn.addEventListener("mouseleave",()=>{
  btn.style.transform="translate(0,0)";
});

/* SCROLL REVEAL */
const reveals=document.querySelectorAll(".reveal");
window.addEventListener("scroll",()=>{
  reveals.forEach(el=>{
    if(el.getBoundingClientRect().top<window.innerHeight-100){
      el.classList.add("show");
    }
  });
});

/* PARALLAX */
document.addEventListener("mousemove",e=>{
  document.querySelectorAll(".layer").forEach(layer=>{
    const speed=20;
    const x=(window.innerWidth/2-e.pageX)/speed;
    const y=(window.innerHeight/2-e.pageY)/speed;
    layer.style.transform=`translate(${x}px,${y}px)`;
  });
});
</script>

</body>
</html>
