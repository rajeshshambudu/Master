<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pro Master UI</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #0a0a0a;
  --text: #ffffff;
  --card: rgba(255,255,255,0.05);
  --border: rgba(255,255,255,0.1);
  --primary: #00f7ff;
}

/* THEMES */
.light {
  --bg: #ffffff;
  --text: #111;
  --card: rgba(0,0,0,0.05);
  --border: rgba(0,0,0,0.1);
  --primary: #007bff;
}

.hybrid {
  --bg: #0f172a;
  --text: #e5e7eb;
  --card: rgba(255,255,255,0.05);
  --primary: #22d3ee;
}

* {margin:0;padding:0;box-sizing:border-box;}
body {
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--text);
  transition: 0.3s;
}

/* NAV */
nav {
  position: fixed;
  width: 100%;
  padding: 15px 40px;
  display: flex;
  justify-content: space-between;
  backdrop-filter: blur(10px);
  background: var(--card);
  border-bottom: 1px solid var(--border);
  z-index: 1000;
}

nav a {
  margin-left: 20px;
  color: var(--text);
  text-decoration: none;
}

nav a:hover {
  color: var(--primary);
}

/* HERO */
.hero {
  height: 100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
}

.hero h1 {
  font-size: 3rem;
  background: linear-gradient(90deg, var(--primary), #ff00ff);
  -webkit-background-clip: text;
  color: transparent;
}

.btn {
  margin-top:20px;
  padding:12px 25px;
  border:none;
  border-radius:30px;
  background: var(--primary);
  color:white;
  cursor:pointer;
  transition:0.3s;
}

.btn:hover {
  transform: scale(1.05);
  box-shadow: 0 0 20px var(--primary);
}

/* GLASS */
.glass {
  background: var(--card);
  border:1px solid var(--border);
  backdrop-filter: blur(15px);
  padding:25px;
  border-radius:15px;
  transition:0.3s;
}

.glass:hover {
  transform: translateY(-8px);
}

/* GRID */
section {padding:100px 10%;}
.grid {
  display:grid;
  grid-template-columns: repeat(auto-fit,minmax(250px,1fr));
  gap:25px;
}

h2 {
  text-align:center;
  margin-bottom:40px;
  color: var(--primary);
}

/* ANIMATION */
.fade {
  opacity:0;
  transform: translateY(30px);
  transition:0.8s;
}
.fade.show {
  opacity:1;
  transform: translateY(0);
}

/* THEME SWITCH */
.theme-switch {
  position: fixed;
  bottom: 20px;
  right: 20px;
}

.theme-switch button {
  margin:5px;
  padding:10px;
  border:none;
  cursor:pointer;
}

footer {
  text-align:center;
  padding:30px;
  opacity:0.6;
}
</style>
</head>

<body>

<nav>
  <h3>⚡ Brand</h3>
  <div>
    <a href="#about">About</a>
    <a href="#features">Features</a>
    <a href="#portfolio">Portfolio</a>
  </div>
</nav>

<section class="hero">
  <div>
    <h1>Future Interface</h1>
    <button class="btn">Get Started</button>
  </div>
</section>

<section id="about">
  <h2>About</h2>
  <div class="glass fade">
    High-performance UI with multiple themes and modern UX.
  </div>
</section>

<section id="features">
  <h2>Features</h2>
  <div class="grid">
    <div class="glass fade">⚡ Fast</div>
    <div class="glass fade">🎨 Stylish</div>
    <div class="glass fade">📱 Responsive</div>
  </div>
</section>

<section id="portfolio">
  <h2>Portfolio</h2>
  <div class="grid">
    <div class="glass fade">Project A</div>
    <div class="glass fade">Project B</div>
    <div class="glass fade">Project C</div>
  </div>
</section>

<footer>© 2026 Pro UI</footer>

<!-- THEME SWITCH -->
<div class="theme-switch">
  <button onclick="setTheme('')">Cyberpunk</button>
  <button onclick="setTheme('light')">Minimal</button>
  <button onclick="setTheme('hybrid')">Hybrid</button>
</div>

<script>
function setTheme(theme){
  document.body.className = theme;
}

/* Scroll Animation */
const faders = document.querySelectorAll('.fade');

window.addEventListener('scroll', () => {
  faders.forEach(el => {
    if (el.getBoundingClientRect().top < window.innerHeight - 100) {
      el.classList.add('show');
    }
  });
});
</script>

</body>
</html>
